<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 336" width="880" height="336" role="img" aria-label="Owlmic system architecture">
  <defs>
    <marker id="arr-hi" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 1 L7 4 L0 7 Z" fill="#E6E6E6" />
    </marker>
    <marker id="arr-lo" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 1 L7 4 L0 7 Z" fill="#555558" />
    </marker>
    <style>
      .head { font: 600 13px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #FFFFFF; }
      .meta { font: 400 10.5px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8E8E93; }
      .item { font: 500 12px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #FFFFFF; }
      .item-m { font: 500 12px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #E6E6E6; }
      .item-d { font: 500 12px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8E8E93; }
      .sub { font: 400 11px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8E8E93; }
      .mono { font: 400 10.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #8E8E93; }
      .mono-hi { font: 600 10.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #FFFFFF; }
      .mono-lo { font: 400 10.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #555558; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="879" height="335" rx="12" fill="#000000" stroke="#262626" />

  <rect x="20" y="20" width="240" height="208" rx="8" fill="#0A0A0A" stroke="#262626" />
  <text x="36" y="46" class="head">Phone</text>
  <text x="244" y="46" text-anchor="end" class="meta">Android · Kotlin / C++</text>
  <line x1="20" y1="64" x2="260" y2="64" stroke="#262626" />

  <text x="36" y="88" class="item">Audio</text>
  <text x="36" y="105" class="sub">Oboe · 48 kHz · Opus</text>
  <line x1="36" y1="119" x2="244" y2="119" stroke="#1C1C1E" />

  <text x="36" y="142" class="item">Video</text>
  <text x="36" y="159" class="sub">CameraX · OpenGL · H.264</text>
  <line x1="36" y1="173" x2="244" y2="173" stroke="#1C1C1E" />

  <text x="36" y="196" class="item">Control</text>
  <text x="36" y="213" class="sub">OwlmicService · Compose</text>

  <line x1="260" y1="112" x2="293" y2="112" stroke="#E6E6E6" stroke-width="1.2" marker-end="url(#arr-hi)" />
  <line x1="296" y1="148" x2="263" y2="148" stroke="#555558" stroke-width="1.2" marker-end="url(#arr-lo)" />

  <rect x="296" y="20" width="288" height="208" rx="8" fill="#0A0A0A" stroke="#262626" />
  <text x="312" y="46" class="head">Wire Protocol v3</text>
  <text x="568" y="46" text-anchor="end" class="meta">30s session hold</text>
  <line x1="296" y1="64" x2="584" y2="64" stroke="#262626" />

  <text x="312" y="89" class="mono-hi">1</text>
  <text x="332" y="89" class="item">USB Debugging</text>
  <text x="568" y="89" text-anchor="end" class="mono">&lt; 10 ms · :7653</text>
  <line x1="312" y1="105" x2="568" y2="105" stroke="#1C1C1E" />

  <text x="312" y="130" class="mono">2</text>
  <text x="332" y="130" class="item-m">USB Tethering</text>
  <text x="568" y="130" text-anchor="end" class="mono">&lt; 15 ms · :7655</text>
  <line x1="312" y1="146" x2="568" y2="146" stroke="#1C1C1E" />

  <text x="312" y="171" class="mono">3</text>
  <text x="332" y="171" class="item-m">Wi-Fi LAN</text>
  <text x="568" y="171" text-anchor="end" class="mono">&lt; 25 ms · AES-GCM</text>
  <line x1="312" y1="187" x2="568" y2="187" stroke="#1C1C1E" />

  <text x="312" y="212" class="mono-lo">4</text>
  <text x="332" y="212" class="item-d">Bluetooth</text>
  <text x="568" y="212" text-anchor="end" class="mono-lo">~45 ms · Audio</text>

  <line x1="584" y1="112" x2="617" y2="112" stroke="#E6E6E6" stroke-width="1.2" marker-end="url(#arr-hi)" />
  <line x1="620" y1="148" x2="587" y2="148" stroke="#555558" stroke-width="1.2" marker-end="url(#arr-lo)" />

  <rect x="620" y="20" width="240" height="208" rx="8" fill="#0A0A0A" stroke="#262626" />
  <text x="636" y="46" class="head">PC</text>
  <text x="844" y="46" text-anchor="end" class="meta">Win / Linux · Rust</text>
  <line x1="620" y1="64" x2="860" y2="64" stroke="#262626" />

  <text x="636" y="88" class="item">Audio DSP</text>
  <text x="636" y="105" class="sub">Jitter · ±0.2% · RNNoise</text>
  <line x1="636" y1="119" x2="844" y2="119" stroke="#1C1C1E" />

  <text x="636" y="142" class="item">Video</text>
  <text x="636" y="159" class="sub">H.264 · NV12 shared ring</text>
  <line x1="636" y1="173" x2="844" y2="173" stroke="#1C1C1E" />

  <text x="636" y="196" class="item">Runtime</text>
  <text x="636" y="213" class="sub">Supervised hubs · Direct2D</text>

  <line x1="740" y1="228" x2="740" y2="252" stroke="#262626" stroke-width="1.2" />

  <line x1="1" y1="252" x2="879" y2="252" stroke="#262626" />
  <line x1="293" y1="252" x2="293" y2="335" stroke="#262626" />
  <line x1="587" y1="252" x2="587" y2="335" stroke="#262626" />

  <text x="24" y="286" class="item">Owlmic Mic</text>
  <text x="24" y="307" class="sub">WASAPI bridge · PipeWire source</text>

  <text x="317" y="286" class="item">Owlmic Cam</text>
  <text x="317" y="307" class="sub">Win11 MF · DirectShow · v4l2loopback</text>

  <text x="611" y="286" class="item">Speaker Loopback</text>
  <text x="611" y="307" class="sub">PC system audio → Phone output</text>
</svg>
