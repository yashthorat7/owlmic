# Updates arrive as one grouped PR per part of the project, every Monday, and only the kind
# that can't break the build on its own. Bigger upgrades are done by hand. Security fixes come
# separately, as soon as there is one (repo settings, Dependabot security updates).
version: 2

updates:
  # Only what Cargo itself treats as compatible: Cargo.lock moves, Cargo.toml doesn't. For 0.x
  # crates even a "minor" bump can break the code, so skipping majors isn't enough here.
  - package-ecosystem: "cargo"
    directory: "/desktop"
    schedule:
      interval: "weekly"
      day: "monday"
    versioning-strategy: "lockfile-only"
    open-pull-requests-limit: 1
    groups:
      desktop:
        patterns: ["*"]
    labels:
      - "dependencies"
      - "desktop"
    commit-message:
      prefix: "chore(desktop)"

  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 1
    groups:
      android:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"
      - "android"
    commit-message:
      prefix: "chore(android)"

  # Actions only publish major tags (v4, v5), so majors are the updates here.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 1
    groups:
      ci:
        patterns: ["*"]
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(ci)"
