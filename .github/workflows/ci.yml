name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pc-checks:
    name: PC (Rust) on Windows
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            pc/target
          key: cargo-${{ runner.os }}-${{ hashFiles('pc/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Rustfmt
        run: cargo fmt --all --check --manifest-path pc/Cargo.toml

      - name: Clippy
        run: cargo clippy --manifest-path pc/Cargo.toml --all-targets -- -D warnings

      - name: Tests
        run: cargo test --manifest-path pc/Cargo.toml

  android-checks:
    name: Android — Unit Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Unit tests, lint and build
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleDebug

  verify-invariants:
    name: Repo Invariants & Hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify repository invariants
        run: python3 scripts/verify-repo-invariants.py

      - name: Check how Owlmic is written
        run: |
          if git grep -nIE 'OwlMic|owlMic|Owl[ -][Mm]ic' -- . ':!.github/workflows/ci.yml'; then
            echo "Write the name as Owlmic, as in design/copy.json."
            exit 1
          fi

  pc-linux:
    name: PC (Rust) on Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            pc/target
          key: cargo-${{ runner.os }}-${{ hashFiles('pc/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Check portable & Linux crates
        run: cargo check --manifest-path pc/Cargo.toml -p owlmic-proto -p owlmic-platform -p owlmic-link -p owlmic-media -p owlmic-settings -p owlmic-hub -p owlmic-session -p owlmic-linux

      - name: Tests
        run: cargo test --manifest-path pc/Cargo.toml -p owlmic-proto -p owlmic-platform -p owlmic-settings -p owlmic-hub -p owlmic-session
