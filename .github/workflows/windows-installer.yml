name: Windows installer

# Builds owlmic.exe and Owlmic-Setup-x.y.z.exe on Windows. The installer bundles the Owlmic microphone
# driver files, downloaded here and checked against a known checksum.
on:
  workflow_dispatch:
  # The Release workflow calls this one for version tags.
  workflow_call:
  pull_request:
    paths:
      - 'pc/installer/**'
      - 'pc/Cargo.toml'
      - 'pc/crates/**'
      - 'pc/vcam/**'
      - '.github/workflows/windows-installer.yml'

permissions:
  contents: read

jobs:
  installer:
    name: Build the Windows installer
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # libopus, built from the same submodule as the Android app.
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Ensure softcam.dll
        shell: pwsh
        run: |
          if (-not (Test-Path "pc\softcam.dll")) {
            $expectedHash = '9D635E0AF682A883C3C7D407513D47E59B0883771701B101216820DFCF997F0B'
            $url = 'https://raw.githubusercontent.com/diveshpatil9104/owlmic/3f78b5767f64f4542b4307c586da4b609d54d38e/pc/softcam.dll'
            Invoke-WebRequest -Uri $url -OutFile pc\softcam.dll -UseBasicParsing
            $hash = (Get-FileHash pc\softcam.dll -Algorithm SHA256).Hash
            if ($hash -ne $expectedHash) {
              throw "Downloaded softcam.dll checksum mismatch: $hash"
            }
          }

      # Static C runtime: owlmic.exe runs without the Visual C++ Redistributable.
      - name: Build owlmic.exe
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --manifest-path pc/Cargo.toml

      - name: Check the microphone setup script
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\pc\installer\windows\setup-audio-device.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_.ToString() }; exit 1 }

      - name: Download the microphone driver files
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\owlmic-mic-driver.zip"
          $expectedHash = 'B950E39F01AF1D04EA623C8F6D8EB9B6EA5C477C637295FABF20631C85116BFB'
          $sources = @(
            'https://download.vb-audio.com/Download_CABLE/VBCABLE_Driver_Pack45.zip',
            'https://web.archive.org/web/20240901000000id_/https://download.vb-audio.com/Download_CABLE/VBCABLE_Driver_Pack45.zip'
          )
          $downloaded = $false
          $ProgressPreference = 'SilentlyContinue'
          foreach ($url in $sources) {
            try {
              Write-Host "Downloading the Owlmic microphone driver from $url..."
              if (Test-Path $zip) { Remove-Item $zip -Force }
              Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing -UserAgent 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)' -TimeoutSec 60
              $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
              if ($hash -eq $expectedHash) {
                $downloaded = $true
                Write-Host "Driver checksum verified: $hash"
                break
              }
              Write-Warning "Checksum mismatch for ${url}: got $hash, expected $expectedHash"
            } catch {
              Write-Warning "Invoke-WebRequest failed for ${url}: $($_.Exception.Message)"
              try {
                if (Test-Path $zip) { Remove-Item $zip -Force }
                & curl.exe -sS -f -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" -o $zip $url --max-time 60
                $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
                if ($hash -eq $expectedHash) {
                  $downloaded = $true
                  Write-Host "Driver checksum verified via curl: $hash"
                  break
                }
                Write-Warning "Checksum mismatch via curl for ${url}: got $hash, expected $expectedHash"
              } catch {
                Write-Warning "curl failed for ${url}: $($_.Exception.Message)"
              }
            }
          }
          if (-not $downloaded) {
            throw "Failed to download verified driver pack from any source."
          }
          Expand-Archive $zip -DestinationPath pc\installer\windows\driver -Force

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build the installer
        shell: pwsh
        run: |
          $version = (Select-String -Path pc\Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe", "$env:ProgramFiles\Inno Setup *\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) { throw "Inno Setup's compiler wasn't found" }
          & $iscc.FullName "/DMyAppVersion=$version" pc\installer\windows\owlmic.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item pc\target\release\owlmic.exe "pc\installer\windows\Output\Owlmic-v$version-windows-x64.exe"

      - name: Check the installer size
        shell: pwsh
        run: |
          # The design's budget: about 4 MB, never above 5 MB.
          $limit = 5MB
          foreach ($f in 'pc\target\release\owlmic.exe', 'pc\target\release\owlmic_vcam.dll', 'pc\softcam.dll') {
            '{0,-40} {1,8:N2} MB' -f $f, ((Get-Item $f).Length / 1MB)
          }
          '{0,-40} {1,8:N2} MB' -f 'pc\installer\windows\driver (all files)', ((Get-ChildItem pc\installer\windows\driver -Recurse -File | Measure-Object Length -Sum).Sum / 1MB)
          $setup = Get-Item pc\installer\windows\Output\Owlmic-Setup-*.exe
          $size = $setup.Length
          '{0,-40} {1,8:N2} MB' -f $setup.Name, ($size / 1MB)
          if ($size -gt $limit) { throw ("The installer is {0:N2} MB, above the 5 MB budget." -f ($size / 1MB)) }

      - name: Upload the installer and owlmic.exe
        uses: actions/upload-artifact@v7
        with:
          name: owlmic-windows
          path: pc/installer/windows/Output/*.exe
          if-no-files-found: error
